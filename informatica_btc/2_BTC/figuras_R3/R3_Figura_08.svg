   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Carlito'; text-anchor: middle; fill: #0f2236" x="219.685039" y="18.923228" transform="rotate(-0 219.685039 18.923228)">Nodos y manijas: cómo se edita una curva</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Carlito'; text-anchor: middle; fill: #0b4f7c" x="219.685039" y="37.140748" transform="rotate(-0 219.685039 37.140748)">El trazado vectorial es una curva Bézier definida por cuatro puntos</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Carlito'; fill: #0b4f7c" transform="translate(78.78788 185.632117)">Nodo</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Carlito'; fill: #0b4f7c" transform="translate(51.139247 198.449499)">(punto de anclaje)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Carlito'; text-anchor: middle; fill: #0b4f7c" x="348.661417" y="184.473425" transform="rotate(-0 348.661417 184.473425)">Nodo</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Carlito'; text-anchor: middle; fill: #b8730a" x="133.228346" y="58.875984" transform="rotate(-0 133.228346 58.875984)">Manija de control</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Carlito'; text-anchor: middle; fill: #b8730a" x="269.291339" y="58.875984" transform="rotate(-0 269.291339 58.875984)">Manija de control</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Carlito'; text-anchor: middle; fill: #0b4f7c" x="219.685039" y="122.655512" transform="rotate(-0 219.685039 122.655512)">Trazado</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Carlito'; fill: #5b6b78" transform="translate(165.130547 136.324692)">La manija marca la dirección</text>
    <text style="font-size: 9.5px; font-family: 'Carlito'; fill: #5b6b78" transform="translate(167.174532 147.921371)">de la curva al salir del nodo</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Carlito'; text-anchor: middle; fill: #ffffff" x="113.385827" y="234.999016" transform="rotate(-0 113.385827 234.999016)">Nodo</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Carlito'; fill: #0f2236" transform="translate(51.023622 260.68875)">Moverlo cambia el punto por donde</text>
    <text style="font-size: 10.5px; font-family: 'Carlito'; fill: #0f2236" transform="translate(51.023622 273.506132)">pasa el trazado (el anclaje).</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Carlito'; text-anchor: middle; fill: #ffffff" x="325.984252" y="234.999016" transform="rotate(-0 325.984252 234.999016)">Manija de control</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.8px; font-family: 'Carlito'; fill: #0f2236" transform="translate(260.787402 254.95955)">Moverla cambia dirección y curvatura;</text>
    <text style="font-size: 9.8px; font-family: 'Carlito'; fill: #0f2236" transform="translate(260.787402 266.922441)">el nodo no se mueve. En punteado:</text>
    <text style="font-size: 9.8px; font-family: 'Carlito'; fill: #0f2236" transform="translate(260.787402 278.885332)">la curva con la manija desplazada.</text>
   </g>
